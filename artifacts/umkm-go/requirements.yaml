packages:
  "recharts": "For dashboard and admin analytics charts"
  "framer-motion": "For smooth page transitions and UI animations"
  "date-fns": "For formatting dates in tables and logs"
  "react-hook-form": "For robust form handling"
  "@hookform/resolvers": "For Zod schema validation in forms"
  "zod": "For form validation schemas"
  "lucide-react": "For UI icons"

images:
  - path: "artifacts/umkm-go/public/images/hero-bg.png"
    description: "Abstract modern gradient mesh background in fresh teal, mint green, and white with soft light leaks, corporate SaaS style"
    aspect_ratio: "16:9"
  - path: "artifacts/umkm-go/public/images/illustration-shop.png"
    description: "A clean modern minimal 3D illustration of a digital storefront or shop on a white background, teal accents"
    aspect_ratio: "1:1"
  - path: "artifacts/umkm-go/public/images/illustration-empty.png"
    description: "A clean minimal 3D illustration of an open empty cardboard box or empty folder, soft lighting"
    aspect_ratio: "1:1"

notes:
  - "App uses wouter for routing"
  - "Using generated TanStack Query hooks from @workspace/api-client-react"
  - "Auth relies on localStorage tokens passed via headers in custom fetch wrapper or manually in useQuery requests where possible. To simplify, we will assume customFetch handles it if available, or we will mock the auth state tightly."
